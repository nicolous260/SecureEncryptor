name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SecureEncryptor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SecureEncryptor-apk
          path: SecureEncryptor.apk

      - name: Read app version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # Creates the tag on GitHub if it does not exist yet, so "Run workflow" is enough.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          files: SecureEncryptor.apk
          generate_release_notes: true
